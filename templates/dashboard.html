<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Steam Monitor / Twitch Miner</title>
    <style>
        body {
            background-color: #2b3925;
            color: #d1d7bd;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 11px;
            margin: 0;
            padding: 10px;
        }
        .window {
            background: #3c4d33;
            border: 2px solid #556b47;
            border-top: 2px solid #6b855c;
            border-left: 2px solid #6b855c;
            width: 750px;
            margin: 20px auto;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.6);
        }
        .title-bar {
            background: linear-gradient(to bottom, #5d784e 0%, #3c4d33 100%);
            color: #ffffff;
            padding: 4px 8px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #232d1e;
        }
        .content {
            padding: 12px;
        }
        .panel {
            background: #232d1e;
            border: 1px solid #1a2216;
            padding: 10px;
            margin-bottom: 10px;
        }
        input[type="text"] {
            background: #1a2216;
            border: 1px solid #4a613d;
            color: #d1d7bd;
            padding: 4px;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 11px;
        }
        button {
            background: linear-gradient(to bottom, #4a613d 0%, #2f3e26 100%);
            border: 1px solid #6b855c;
            color: #ffffff;
            padding: 4px 12px;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 11px;
            cursor: pointer;
        }
        button:hover {
            background: linear-gradient(to bottom, #567347 0%, #36492c 100%);
        }
        .btn-danger {
            background: linear-gradient(to bottom, #7a3a3a 0%, #472121 100%);
            border: 1px solid #a85252;
        }
        .btn-danger:hover {
            background: linear-gradient(to bottom, #944444 0%, #5e2b2b 100%);
        }
        .channel-row {
            display: flex;
            align-items: center;
            padding: 4px 0;
            border-bottom: 1px dashed #33422b;
            gap: 10px;
        }
        .channel-row img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid #556b47;
        }
        a {
            color: #92b579;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="window">
        <div class="title-bar">
            <span>Steam Monitor - Twitch Points Miner [{{ display_name }}]</span>
            <a href="/logout" style="color: #ff9999;">log out</a>
        </div>
        <div class="content">
            
            <div class="panel">
                <b>Статус фарминга:</b> <span style="color: #a3d977;">{{ status }}</span>
                {% if is_running %}
                <form action="/stop_miner" method="POST" style="display:inline; margin-left: 15px;">
                    <button type="submit" class="btn-danger">Остановить</button>
                </form>
                {% endif %}
            </div>

            <div class="panel">
                <b>Добавить канал вручную:</b>
                <form action="/add_channel" method="POST" style="margin-top: 5px; display: flex; gap: 5px;">
                    <input type="text" name="new_channel" placeholder="например: shroud" style="flex:1;" required>
                    <button type="submit">Добавить</button>
                </form>
            </div>

            <div class="panel">
                <b>Список каналов для фарма:</b>
                <form action="/start_miner" method="POST">
                    <div style="max-height: 200px; overflow-y: auto; margin: 8px 0; padding-right: 5px;">
                        {% if streamers %}
                            {% for s in streamers %}
                            <div class="channel-row">
                                <input type="checkbox" name="channels" value="{{ s.login }}" id="ch_{{ s.login }}" {% if s.login in selected_channels %}checked{% endif %}>
                                <img src="{{ s.avatar }}" alt="">
                                <label for="ch_{{ s.login }}" style="flex:1; cursor:pointer;"><b>{{ s.name }}</b></label>
                                <button type="submit" formaction="/remove_channel" name="channel" value="{{ s.login }}" class="btn-danger" style="padding: 2px 6px;">Удалить</button>
                            </div>
                            {% endfor %}
                        {% else %}
                            <div style="color: #888; text-align: center; padding: 10px;">Каналы не добавлены. Введите ник выше.</div>
                        {% endif %}
                    </div>
                    <button type="submit" style="width: 100%; padding: 6px; font-weight: bold; background: linear-gradient(to bottom, #557a3d 0%, #314723 100%);">Сохранить и запустить фарминг</button>
                </form>
            </div>

        </div>
    </div>
</body>
</html>
