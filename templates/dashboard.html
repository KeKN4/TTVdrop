<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TTV Farm Station - Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-info img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #9146FF;
        }
        .status-box {
            background: #2a2a2a;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .add-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .add-form input {
            flex: 1;
            padding: 10px 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
        }
        .add-form button {
            padding: 10px 20px;
            background: #9146FF;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .add-form button:hover {
            background: #772ce8;
        }
        .channels-container {
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            background: #181818;
            margin-bottom: 20px;
        }
        .channel-item {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid #2a2a2a;
            gap: 12px;
        }
        .channel-item:last-child {
            border-bottom: none;
        }
        .channel-item img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
        }
        .channel-item label {
            flex: 1;
            cursor: pointer;
            font-size: 15px;
        }
        .btn-delete {
            background: #eb0400;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-delete:hover {
            background: #c20300;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .btn-start {
            background: #008000;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-start:hover {
            background: #006600;
        }
        .btn-stop {
            background: #b30000;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-stop:hover {
            background: #990000;
        }
        .logout-link {
            color: #ff5555;
            text-decoration: none;
            font-size: 14px;
        }
        .logout-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="user-info">
                <img src="{{ avatar_url }}" alt="Avatar">
                <div>
                    <h3 style="margin: 0;">{{ display_name }}</h3>
                    <span style="color: #888; font-size: 13px;">@{{ username }}</span>
                </div>
            </div>
            <a href="/logout" class="logout-link">[ Выйти ]</a>
        </div>

        <div class="status-box">
            <span>Статус фарминга: <b>{{ status }}</b></span>
            {% if is_running %}
            <form action="/stop_miner" method="POST" style="margin: 0;">
                <button type="submit" class="btn-stop">Остановить майнер</button>
            </form>
            {% endif %}
        </div>

        <h3>Управление каналами для фарма</h3>
        
        <!-- Форма добавления канала -->
        <form action="/add_channel" method="POST" class="add-form">
            <input type="text" name="new_channel" placeholder="Введите ник стримера (например, shroud)" autocomplete="off" required>
            <button type="submit">Добавить</button>
        </form>

        <!-- Список каналов -->
        <form action="/start_miner" method="POST">
            <div class="channels-container">
                {% if streamers %}
                    {% for s in streamers %}
                    <div class="channel-item">
                        <input type="checkbox" name="channels" value="{{ s.login }}" id="ch_{{ s.login }}" {% if s.login in selected_channels %}checked{% endif %}>
                        <img src="{{ s.avatar }}" alt="Streamer Avatar">
                        <label for="ch_{{ s.login }}"><b>{{ s.name }}</b></label>
                        <button type="submit" formaction="/remove_channel" name="channel" value="{{ s.login }}" class="btn-delete">Удалить</button>
                    </div>
                    {% endfor %}
                {% else %}
                    <div style="text-align: center; color: #777; padding: 20px;">
                        Список каналов пуст. Добавьте первый канал выше!
                    </div>
                {% endif %}
            </div>

            <div class="actions">
                <button type="submit" class="btn-start">Сохранить и запустить фарминг</button>
            </div>
        </form>
    </div>
</body>
</html>
