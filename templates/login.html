<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Steam Login — TTV Dropper</title>
    <style>
        :root {
            --steam-bg: #4c5844;
            --steam-dark: #3a4334;
            --steam-darker: #282e24;
            --steam-light: #5e6d54;
            --steam-border-hi: #6d7f62;
            --steam-border-lo: #272d22;
            --steam-text: #c4cebe;
            --steam-text-bright: #e1e9db;
            --steam-text-muted: #8d9885;
            --steam-red: #ff7878;
        }
        * { box-sizing: border-box; user-select: none; }
        body {
            font-family: "Tahoma", "Segoe UI", Arial, sans-serif;
            background-color: #1a1e17;
            color: var(--steam-text);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-size: 11px;
        }
        .login-dialog {
            width: 420px;
            background-color: var(--steam-bg);
            border: 1px solid var(--steam-border-hi);
            box-shadow: 2px 2px 0px var(--steam-border-lo), inset 1px 1px 0px var(--steam-light);
            padding: 2px;
        }
        .dialog-title {
            background: linear-gradient(to right, #434e3c, #3a4434);
            padding: 5px 8px;
            font-weight: bold;
            color: var(--steam-text-bright);
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--steam-border-lo);
        }
        .dialog-body {
            padding: 16px;
            background-color: var(--steam-dark);
            margin: 2px;
            border: 1px solid var(--steam-border-lo);
        }
        .error-msg {
            background: #4d2323;
            border: 1px solid var(--steam-red);
            color: var(--steam-red);
            padding: 8px;
            margin-bottom: 12px;
            font-size: 11px;
        }
        .hint-box {
            background: var(--steam-darker);
            border: 1px solid var(--steam-border-lo);
            padding: 8px;
            color: var(--steam-text-muted);
            margin-bottom: 12px;
            line-height: 1.4;
        }
        label { display: block; margin-bottom: 6px; color: var(--steam-text-bright); }
        input[type="text"], input[type="password"] {
            width: 100%;
            background-color: var(--steam-darker);
            border: 1px solid var(--steam-border-lo);
            box-shadow: inset 1px 1px 2px #000;
            color: #fff;
            padding: 7px 8px;
            margin-bottom: 14px;
            font-size: 11px;
            outline: none;
            font-family: monospace;
        }
        .btn-row { display: flex; justify-content: flex-end; gap: 8px; }
        .steam-btn {
            background-color: var(--steam-bg);
            border-top: 1px solid var(--steam-border-hi);
            border-left: 1px solid var(--steam-border-hi);
            border-right: 1px solid var(--steam-border-lo);
            border-bottom: 1px solid var(--steam-border-lo);
            color: var(--steam-text-bright);
            padding: 5px 16px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }
        .steam-btn:hover { background-color: var(--steam-light); }
        .steam-btn:active {
            border-top: 1px solid var(--steam-border-lo);
            border-left: 1px solid var(--steam-border-lo);
            border-right: 1px solid var(--steam-border-hi);
            border-bottom: 1px solid var(--steam-border-hi);
        }
    </style>
</head>
<body>
    <div class="login-dialog">
        <div class="dialog-title">
            <span>Steam Login — Twitch Authentication</span>
            <span>✕</span>
        </div>
        <div class="dialog-body">
            {% if error %}
            <div class="error-msg">
                <b>Connection Error:</b> {{ error }}
            </div>
            {% endif %}

            <div class="hint-box">
                <b>Как получить auth-token:</b><br>
                1. Открой <a href="https://twitch.tv" target="_blank" style="color: #a3b899;">twitch.tv</a> в браузере.<br>
                2. Нажми <b>F12</b> &rarr; вкладка <b>Application</b> (или <b>Память</b>) &rarr; слева <b>Cookies</b>.<br>
                3. Скопируй значение cookie <code>auth-token</code>.
            </div>

            <form action="/login" method="POST">
                <label>Twitch Web Auth-Token:</label>
                <input type="password" name="auth_token" placeholder="Например: g84jxkd92..." required autocomplete="off">

                <div class="btn-row">
                    <button type="submit" class="steam-btn">Login</button>
                    <button type="button" class="steam-btn" onclick="window.location.reload()">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
